# ==============================================================================
# CampusCash - 1-Click Render.com Blueprint Configuration
# Deploys: Managed PostgreSQL Database + Spring Boot Backend + React Frontend
# ==============================================================================

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: campuscash-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: campuscash-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: campuscash-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: campuscash-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: campuscash-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: campuscash-db
          property: password
      - key: POSTGRES_PORT
        fromDatabase:
          name: campuscash-db
          property: port
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: APP_SEED_DEMO_DATA
        value: "true"

  # 2. React Vite Frontend Static Site (Global CDN)
  - type: web
    name: campuscash-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campuscash-backend
          property: host

# 3. Free Managed PostgreSQL Database
databases:
  - name: campuscash-db
    databaseName: campuscash
    user: campuscash_admin
    plan: free
    region: oregon
