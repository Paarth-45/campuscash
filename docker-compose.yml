version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campuscash-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuscash}
      POSTGRES_USER: ${POSTGRES_USER:-campuscash_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc_prod_sec_7a8f902b1c4e}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuscash_admin} -d ${POSTGRES_DB:-campuscash}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: campuscash-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscash-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/campuscash}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campuscash_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cc_prod_sec_7a8f902b1c4e}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-f4a7c8e912d3b45a67890123456789abcdef0123456789abcdef0123456789ab}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${APP_JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8080}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-GEMINI}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuscash-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - certbot_www:/var/www/certbot:ro

volumes:
  postgres_data:
  redis_data:
  certbot_www:
